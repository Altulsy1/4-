<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fruit Clash — لعبة الفواكه الأربعة</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="style-modern.css" rel="stylesheet">
  <style>
    /* تحسينات صغيرة لعرض الـ toast داخل هذه الصفحة */
    .toast-message {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 30px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      display: flex;
      gap: 8px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 9999;
    }
    .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
    .toast-success { background: linear-gradient(90deg,#00B894,#00D2FF); }
    .toast-error { background: linear-gradient(90deg,#FF7675,#FF6B6B); }
    .toast-info { background: rgba(0,0,0,0.75); }
    /* ضمان أن الشاشة مخفية بشكل افتراضي */
    .screen { display: none; }
    .screen.hidden { display: none !important; }
    /* إظهار الشاشة الرئيسية عند التحميل */
    #main-menu { display: block; }
  </style>
</head>
<body>

  <!-- MAIN MENU -->
  <main id="main-menu" class="screen menu-screen">
    <div class="menu-bg-pattern"></div>
    <div class="menu-content">
      <header class="menu-header">
        <h1 class="menu-title">Fruit Clash</h1>
        <div class="menu-version">الإصدار التجريبي</div>
      </header>

      <section class="player-profile-card">
        <div class="player-avatar">
          <img id="menu-avatar" src="" alt="avatar">
        </div>
        <div class="player-info">
          <span class="player-name-label">اسم اللاعب</span>
          <h3 id="player-name-display">لاعب</h3>
        </div>
        <button id="edit-name-btn" class="edit-name-btn" title="تعديل الاسم"><i class="fas fa-edit"></i></button>
      </section>

      <section class="menu-buttons-modern">
        <button id="create-room-btn" class="menu-btn primary-btn">إنشاء غرفة</button>
        <button id="join-room-btn" class="menu-btn secondary-btn">الانضمام إلى غرفة</button>
        <button id="single-player-btn" class="menu-btn outline-btn">اللاعب الواحد</button>
      </section>

      <section class="quick-play-section">
        <div class="section-label">تشغيل سريع</div>
        <div class="quick-play-buttons">
          <button class="quick-btn" onclick="quickJoinRandom()">انضم عشوائياً</button>
          <button class="quick-btn" onclick="openTutorial()">شرح</button>
        </div>
      </section>

      <section class="online-stats">
        <div class="stat-item">
          <span class="stat-value" id="online-count">--</span>
          <span class="stat-label">متصل الآن</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="games-count">--</span>
          <span class="stat-label">ألعاب</span>
        </div>
      </section>
    </div>
  </main>

  <!-- LOBBY SCREEN -->
  <section id="lobby-screen" class="screen lobby-screen hidden">
    <header class="lobby-header">
      <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-right"></i></button>
      <h2>الغرفة</h2>
      <button class="settings-btn" onclick="showSettings()"><i class="fas fa-gear"></i></button>
    </header>

    <div class="room-code-card">
      <div class="code-label">رمز الغرفة</div>
      <div class="code-display" id="room-code">----</div>
      <button class="copy-code-btn" onclick="copyRoomCode()"><i class="fas fa-copy"></i></button>
    </div>

    <div class="qr-share-section">
      <div id="qr-code-container" class="qr-preview">
        <canvas id="qr-code"></canvas>
      </div>
      <div class="qr-hint">امسح الرمز أو شارك الرابط</div>
    </div>

    <div class="players-grid" id="players-grid">
      <!-- بطاقات اللاعبين تُملأ ديناميكياً -->
    </div>

    <footer class="lobby-footer">
      <button id="start-game-btn" class="start-btn disabled" disabled>ابدأ اللعبة</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <div class="player-count" id="player-count">0/4</div>
        <div class="invite-options">
          <button class="invite-btn" title="مشاركة" onclick="shareInvite()"><i class="fas fa-share-alt"></i></button>
          <button class="invite-btn" title="نسخ" onclick="copyRoomCode()"><i class="fas fa-link"></i></button>
        </div>
      </div>
    </footer>
  </section>

  <!-- GAME SCREEN -->
  <section id="game-screen" class="screen game-screen hidden">
    <header class="game-header-modern">
      <div class="round-info">
        <div class="round-badge">الجولة <span id="round-number">1</span></div>
        <div class="category-badge">الفواكه</div>
      </div>

      <div class="timer-circle">
        <svg viewBox="0 0 100 100">
          <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
          <circle id="timer-progress" class="timer-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-text">
          <div id="game-timer">60</div>
        </div>
      </div>

      <button class="menu-dots-btn" onclick="showGameMenu()"><i class="fas fa-ellipsis-v"></i></button>
    </header>

    <div class="game-area">
      <div class="cards-section">
        <div class="section-header">
          <div class="cards-counter">بطاقات <span id="cards-count">0/4</span></div>
          <div>
            <button id="done-button" class="win-button disabled" disabled>
              <div class="win-button-inner">لقد جمعت 4؟</div>
              <div class="win-button-glow"></div>
            </button>
          </div>
        </div>

        <div id="cards-container" class="cards-grid">
          <!-- بطاقات اللاعب تُعرض هنا -->
        </div>
      </div>

      <div class="players-progress" id="players-progress">
        <!-- تقدم اللاعبين -->
      </div>
    </div>
  </section>

  <!-- RESULT MODAL -->
  <div id="result-modal" class="modern-modal hidden" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9998;">
    <div class="winner-avatar">
      <img id="winner-avatar-img" src="" alt="winner" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <h2 id="result-title" class="winner-title">🎉 فائز!</h2>
    <p id="result-message" class="winner-message">تفاصيل النتيجة</p>

    <div class="winner-stats">
      <div class="winner-stat">
        <span class="stat-value" id="round-time">--</span>
        <span class="stat-label">الزمن</span>
      </div>
      <div class="winner-stat">
        <span class="stat-value" id="win-streak">0</span>
        <span class="stat-label">فوز متتالي</span>
      </div>
    </div>

    <div class="modal-actions">
      <button id="next-round-btn" class="modal-btn primary">الجولة التالية</button>
      <button id="end-game-btn" class="modal-btn secondary">إنهاء اللعبة</button>
    </div>
  </div>

  <!-- SIDE MENU -->
  <aside id="side-menu" class="side-menu hidden">
    <div class="side-menu-header">
      <div class="close-menu"><i class="fas fa-times" onclick="closeSideMenu()"></i></div>
      <div class="menu-profile">
        <img id="side-avatar" src="" alt="avatar">
        <div id="menu-player-name">لاعب</div>
      </div>
    </div>
    <div class="side-menu-items">
      <button class="menu-item" onclick="showHowToPlay()"><i class="fas fa-question-circle"></i> كيفية اللعب</button>
      <button class="menu-item" onclick="showStats()"><i class="fas fa-chart-bar"></i> إحصائياتي</button>
      <button class="menu-item" onclick="shareApp()"><i class="fas fa-share"></i> مشاركة التطبيق</button>
      <button class="menu-item danger" onclick="leaveGame()"><i class="fas fa-sign-out-alt"></i> الخروج</button>
    </div>
    <div class="side-menu-footer">نسخة تجريبية</div>
  </aside>

  <!-- SCRIPTS -->
  <script src="game-modern.js"></script>
  <script>
    // تهيئة كائن اللعبة عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      try {
        window.game = new ModernGame();

        // مزامنة صور الرموز في الواجهة مع الحالة
        const avatarEls = document.querySelectorAll('#menu-avatar, #side-avatar, .player-avatar img');
        avatarEls.forEach(img => {
          if (img && window.game?.state?.avatar) img.src = window.game.state.avatar;
        });

        // إذا كان رابط الانضمام موجود في الـ URL، حاول الانضمام تلقائياً
        const params = new URLSearchParams(window.location.search);
        const join = params.get('join');
        if (join) {
          setTimeout(() => {
            window.game.joinRoom(join.toUpperCase());
          }, 600);
        }
      } catch (e) {
        console.error('تعذر تهيئة اللعبة:', e);
      }
    });
  </script>
</body>
</html>
